<!DOCTYPE html>
<html>
  <head>
    <title>Cool Hacking Thing</title>
    <link rel="stylesheet" href="style.css" />
    <!-- FIXED: Added missing %22 closing quote after http://w3.org -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☣️</text></svg>">
  </head>
  <body>
    <div class="game-text">
      Supa Sigma Hacking App
    </div>

    <div class="button-layer">
      <button class="hacking-btn" onclick="startHacking()">
        Start Hacking
      </button>
    </div>

    <script>
      function startHacking() {
        let answer1 = prompt('You have begun hacking. The AI will ask you questions. Answer correctly to continue. Type 1 to continue hacking.');
        if (answer1 !== '1') return alert('Alert! Connection terminated.');

        let answer2 = prompt('What is used to pick up beakers?'); 
        if (answer2 !== 'Beaker Tongs') return alert('Alert! Connection terminated.');
        alert('Level 1 Firewall bypassed.');

        let answer3 = prompt('What is the highest level shape in HHPS?'); 
        if (answer3 !== 'Octagon') return alert('Alert! Connection terminated.');
        alert('Level 2 Firewall bypassed.');

        let answer4 = prompt('Should you wear big sweaters in the lab?');
        if (answer4 !== 'No') return alert('Alert! Connection terminated.');
        alert('Level 3 Firewall bypassed.');

        let answer5 = prompt('How many hands should be on a microscope at all times?');
        if (answer5 !== '2') return alert('Alert! Connection terminated.');
        alert('Level 4 Firewall bypassed.');

        let answer6 = prompt('When should you eat something in the lab to find out what it is?');
        if (answer6 !== 'Never') return alert('Alert! Connection terminated.');

        let answer7 = prompt('What must you wear to protect you eyes?');
        if (answer7 !== 'Safety Goggles') return alert('Alert! Connection terminated.');
        
        alert('Level 6 Firewall bypassed. FIREWALL TERMINATED');
        <a href="https://example.com"></a>
      }
    </script>
  </body>
</html>
